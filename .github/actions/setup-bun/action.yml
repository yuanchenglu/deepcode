name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Initialize setup diagnostics
      shell: bash
      run: |
        {
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "node=$(node --version 2>/dev/null || true)"
          echo "package_manager=$(node -p \"require('./package.json').packageManager\" 2>/dev/null || true)"
        } > setup-bun.log

    # node-gyp@latest (invoked via bunx for native install scripts) requires Node >=22;
    # some runner images ship an older system Node on PATH
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"

    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "bun_download_url=$URL" >> setup-bun.log
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Record Bun version
      shell: bash
      run: |
        echo "bun=$(bun --version)" >> setup-bun.log
        echo "bun_revision=$(bun --revision 2>/dev/null || true)" >> setup-bun.log

    - name: Get cache directory
      id: cache
      shell: bash
      run: |
        DIR=$(bun pm cache)
        echo "dir=$DIR" >> "$GITHUB_OUTPUT"
        echo "bun_cache=$DIR" >> setup-bun.log

    - name: Restore Bun dependencies
      id: bun-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      run: |
        set -o pipefail
        {
          echo "== bun install =="
          # Workaround for patched peer variants, for example ./patches/standard-openapi.
          if [ "$RUNNER_OS" = "Windows" ]; then
            bun install --linker hoisted ${{ inputs.install-flags }}
          else
            bun install ${{ inputs.install-flags }}
          fi
          echo "== repository diff after install =="
          git status --short
          git diff -- bun.lock package.json packages/opencode/package.json
        } 2>&1 | tee -a setup-bun.log
      shell: bash

    - name: Save Bun dependencies
      if: steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
