name: s1-02-httpapi-migration

on:
  push:
    branches:
      - agent/s1-02-c-identity

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/s1-02-c-identity
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply identity fixture migration
        run: python3 script/s1-02-migrate-httpapi-identity.py

      - name: Commit migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.email "bot@opencode.ai"
          git config user.name "opencode"
          git add packages/opencode/test/server/httpapi-exercise/index.ts packages/opencode/test/server/auth.test.ts
          git commit -m "test(identity): migrate HttpApi identity fixtures | 迁移 HttpApi 身份测试夹具"
          git push origin HEAD:agent/s1-02-c-identity
