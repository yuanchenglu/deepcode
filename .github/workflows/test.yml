name: test

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  # Keep protected branch pushes immutable; cancel only stale PR runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@deepcode.local"
          git config --global user.name "deepcode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Cache ripgrep binary
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/deepcode/bin
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/core/src/ripgrep/binary.ts') }}

      - name: Prewarm ripgrep binary
        if: runner.os == 'Windows'
        run: bun packages/core/script/prepare-ripgrep.ts

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          GITHUB_ACTIONS=false bun turbo test 2>&1 | tee unit-${{ matrix.settings.name }}.log
        env:
          DEEPCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Run S1-02-D installation lifecycle tests
        working-directory: packages/opencode
        run: |
          set -o pipefail
          bun test test/installation --timeout 30000 2>&1 | tee installation-${{ matrix.settings.name }}.log

      - name: Run S1-02-E Core isolation tests
        working-directory: packages/core
        run: |
          set -o pipefail
          bun test test/global.test.ts test/config.test.ts --timeout 30000 2>&1 | tee boundary-core-${{ matrix.settings.name }}.log

      - name: Run S1-02-E full config and permission regression
        working-directory: packages/opencode
        run: |
          set -o pipefail
          bun test test/config test/effect/runtime-flags-deepcode.test.ts test/permission --timeout 30000 2>&1 | tee boundary-opencode-${{ matrix.settings.name }}.log

      - name: Capture S1-02-E OpenCode string inventory
        if: runner.os == 'Linux' && always()
        run: |
          status=0
          git grep -n -I -E 'opencode|OPENCODE' -- packages/core packages/opencode > opencode-boundary-audit.log || status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          cat opencode-boundary-audit.log

      - name: Upload unit and boundary logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            unit-${{ matrix.settings.name }}.log
            packages/opencode/installation-${{ matrix.settings.name }}.log
            packages/core/boundary-core-${{ matrix.settings.name }}.log
            packages/opencode/boundary-opencode-${{ matrix.settings.name }}.log
            opencode-boundary-audit.log

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        timeout-minutes: 15
        working-directory: packages/opencode
        run: |
          set -o pipefail
          bun run test:httpapi 2>&1 | tee httpapi.log

      - name: Upload HttpApi log
        if: runner.os == 'Linux' && always() && hashFiles('packages/opencode/httpapi.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: httpapi-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: packages/opencode/httpapi.log

  e2e:
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report

  apply-s1-02-e-regression-fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'coexistence-boundary-audit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: coexistence-boundary-audit
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply and push audited regression fixes
        run: |
          set -euo pipefail
          script=docs/open-source-readiness/evidence/S1-02/.apply-s1e-regression-fixes.py
          if [ ! -f "$script" ]; then
            echo "S1-02-E regression fixes already applied"
            exit 0
          fi
          python -m py_compile "$script"
          python "$script"
          rm -f "$script"
          git diff --check
          git config user.email "bot@deepcode.local"
          git config user.name "deepcode-ci"
          git add -A
          if git diff --cached --quiet; then
            echo "No regression changes produced"
            exit 1
          fi
          git commit -m "fix(identity): repair S1-02-E regression contracts

          English:
          Restore internal Flag compatibility property names in tests, align DeepCode-owned network and telemetry assertions, fix plugin dependency typing, import Product for CLI errors, and read DEEPCODE_API_KEY at the OpenCode-compatible provider boundary.

          简体中文:
          恢复测试中的内部 Flag 兼容属性名，同步 DeepCode 自有网络与遥测断言，修复插件依赖类型和 CLI Product 导入，并在 OpenCode 兼容 Provider 边界读取 DEEPCODE_API_KEY。"
          git push origin HEAD:coexistence-boundary-audit
