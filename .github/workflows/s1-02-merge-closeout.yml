name: s1-02-merge-closeout

on:
  push:
    branches:
      - s1-02-merge-closeout

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: s1-02-merge-closeout
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Finalize merged S1-02 state
        run: |
          set -euo pipefail
          script=docs/open-source-readiness/evidence/S1-02/.finalize-merge-state.py
          python -m py_compile "$script"
          python "$script"
          rm -f "$script"
          git diff --check
          git config user.email "bot@deepcode.local"
          git config user.name "deepcode-ci"
          git add -A
          git commit -m "docs(readiness): record S1-02 merge completion

          English:
          Update PLAN, evidence, and the remote handoff to record PR #7 merged into develop, the final clean-head CI, and S1-03 as the next unique implementation task.

          简体中文:
          更新 PLAN、证据和远程交接，记录 PR #7 已合入 develop、最终 clean-head CI，以及 S1-03 为下一唯一实施任务。"
          git push origin HEAD:s1-02-merge-closeout
