name: typecheck

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Resolve Bun release
        id: bun
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          url="https://github.com/oven-sh/bun/releases/download/bun-v${version}/bun-linux-x64-baseline.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "node=$(node --version)"
            echo "bun_version=$version"
            echo "bun_download_url=$url"
          } > setup-bun.log

      - name: Download Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: ${{ steps.bun.outputs.url }}

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          {
            echo "bun=$(bun --version)"
            bun install
            echo "== repository diff after install =="
            git status --short
            git diff -- bun.lock package.json packages/opencode/package.json
          } 2>&1 | tee -a setup-bun.log

      - name: Run package typechecks
        run: |
          set -euo pipefail
          {
            echo "== packages/core =="
            bun --cwd packages/core typecheck
            echo "== packages/opencode =="
            bun --cwd packages/opencode typecheck
          } 2>&1 | tee typecheck.log

      - name: Upload typecheck and setup logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            setup-bun.log
            typecheck.log
